<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Emosongi</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        {% load static %}
        <link rel="stylesheet" href="{% static 'emosongi/css/style.css' %}">        
        <link rel="icon" type="image/x-icon" href="{% static 'emosongi/images/favicon.ico' %}">        
    </head>
    <body>
        <main>
             <form id="formEmojis">
                {% csrf_token %}
                <fieldset>
                    <legend id="emosongi-fieldset-legend">Emosongi</legend>
                    <div class="emojis">

                        <p id="heartbox" class="emoji">
                            <label>
                                <input type="radio" id="1" name="my-emotion" value="1" class="emoji-radio">💝
                            </label>
                        </p>

                       <p id="party" class="emoji">
                            <label>
                                <input type="radio" id="2" name="my-emotion" value="2" class="emoji-radio">🥳
                            </label>
                        </p>

                        <p id="smile" class="emoji">
                            <label>
                                <input type="radio" id="3" name="my-emotion" value="3" class="emoji-radio">😊
                            </label>
                        </p>

                        <p id="angry" class="emoji">
                            <label>
                                <input type="radio" id="4" name="my-emotion" value="4" class="emoji-radio">😡
                            </label>
                        </p>

                        <p id="melting" class="emoji">
                            <label>
                                <input type="radio" id="5" name="my-emotion" value="5" class="emoji-radio">🫠
                            </label>
                        </p>

                        <p id="yawning" class="emoji">
                            <label>
                                <input type="radio" id="6" name="my-emotion" value="6" class="emoji-radio">🥱
                            </label>
                        </p>

                        <p id="lol" class="emoji">
                            <label>
                                <input type="radio" id="7" name="my-emotion" value="7" class="emoji-radio">😂
                            </label>
                        </p>

                        <p id="pinoccio" class="emoji">
                            <label>
                                <input type="radio" id="8" name="my-emotion" value="8" class="emoji-radio">🤥
                            </label>
                        </p>

                        <p id="brokenheart" class="emoji">
                            <label>
                                <input type="radio" id="9" name="my-emotion" value="9" class="emoji-radio">💔
                            </label>
                        </p>

                        <p id="hugging" class="emoji">
                            <label>
                                <input type="radio" id="10" name="my-emotion" value="10" class="emoji-radio">🤗
                            </label>
                        </p>
                    </div>
                </fieldset>
            </form>
            <dialog id="results-dialog" class="base-dialog" closedby="any">
                <p id="sing-a-song" class="results-dialog-text"></p>
                <p id="extra-info"></p>
                <p id="artist" class="results-dialog-text"></p>
                <button id="btn-close-results-dialog" commandfor="results-dialog" command="close" autofocus>
                    Close
                </button>
            </dialog>
        </main>
        <script src="{% static 'emosongi/js/magic.js' %}" type="text/javascript"></script>
    </body>
</html>
